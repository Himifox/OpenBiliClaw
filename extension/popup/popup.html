<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>OpenBiliClaw 浏览器连接器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-mark" src="../icons/icon48.png" width="40" height="40" alt="">
          <div class="brand-copy">
            <p class="eyebrow">浏览器连接器</p>
            <h1>OpenBiliClaw</h1>
          </div>
        </div>
        <div id="backendBadge" class="status-badge is-checking" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="backendBadgeText">连接中</span>
        </div>
      </header>

      <section id="connectionCard" class="connection-card is-checking" aria-labelledby="connectionTitle">
        <div class="connection-heading">
          <span class="connection-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M8.2 12.7 6.9 14a3.1 3.1 0 0 0 4.4 4.4l2.3-2.3a3.1 3.1 0 0 0 0-4.4M15.8 11.3l1.3-1.3a3.1 3.1 0 0 0-4.4-4.4l-2.3 2.3a3.1 3.1 0 0 0 0 4.4M9.4 14.6l5.2-5.2"/>
            </svg>
          </span>
          <div>
            <p class="section-kicker">连接</p>
            <h2 id="connectionTitle">正在查找本机服务</h2>
          </div>
        </div>
        <p id="connectionDetail" class="connection-detail">确认 OpenBiliClaw 后端是否已经启动。</p>
        <div class="primary-actions">
          <button id="openAppButton" class="button button-primary" type="button" disabled>
            打开主应用
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
          </button>
          <button id="refreshButton" class="button button-secondary" type="button">
            重新检查
          </button>
        </div>
      </section>

      <section class="current-source" aria-labelledby="currentSourceTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">当前网页</p>
            <h2 id="currentSourceTitle">正在识别</h2>
          </div>
          <span id="currentSourceState" class="source-state is-neutral">等待中</span>
        </div>
        <p id="currentSourceDetail" class="section-detail">打开支持的网站后，这里会显示对应登录态。</p>
      </section>

      <section class="bridge-strip" aria-label="插件职责">
        <div class="bridge-step">
          <span class="bridge-number">01</span>
          <span>同步身份</span>
        </div>
        <div class="bridge-step">
          <span class="bridge-number">02</span>
          <span>采集行为</span>
        </div>
        <div class="bridge-step">
          <span class="bridge-number">03</span>
          <span>执行只读任务</span>
        </div>
      </section>

      <section class="sync-panel" aria-labelledby="syncTitle">
        <div>
          <h2 id="syncTitle">身份与来源</h2>
          <p id="sourceSummary" class="section-detail">连接后读取来源状态。</p>
        </div>
        <button id="syncButton" class="button button-quiet" type="button" disabled>同步身份</button>
      </section>
      <p id="actionStatus" class="action-status" role="status" aria-live="polite"></p>

      <details id="sourcesDetails" class="disclosure">
        <summary>
          <span>查看全部来源</span>
          <span id="sourceCount" class="summary-count">0 个已启用 · 共 11 个</span>
        </summary>
        <div id="sourceList" class="source-list"></div>
      </details>

      <details id="settingsDetails" class="disclosure settings-disclosure">
        <summary>
          <span>连接设置</span>
          <span class="summary-hint">高级</span>
        </summary>
        <form id="endpointForm" class="settings-form">
          <label for="backendScheme">协议</label>
          <select id="backendScheme">
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
          </select>

          <label for="backendHost">主机</label>
          <input id="backendHost" type="text" inputmode="url" autocomplete="off" spellcheck="false">

          <label for="backendPort">端口</label>
          <input id="backendPort" type="number" inputmode="numeric" min="1" max="65535">

          <button id="saveEndpointButton" class="button button-secondary settings-submit" type="submit">
            保存并测试
          </button>
          <p id="endpointStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <div class="pairing-block">
          <div>
            <h3>远程设备配对</h3>
            <p id="extLoginStatus" class="section-detail">本机连接通常不需要配对。</p>
          </div>
          <input id="extDeviceKey" type="password" autocomplete="off" placeholder="设备访问密钥" hidden>
          <button id="extLoginButton" class="button button-secondary" type="button" hidden>配对设备</button>
        </div>
      </details>

      <footer>
        <span>数据只发送到你配置的 OpenBiliClaw 后端。</span>
        <span id="extensionVersion" class="version"></span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
